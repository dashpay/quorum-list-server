name: Release
run-name: Release ${{ inputs.tag || github.ref_name }}${{ github.event_name == 'workflow_dispatch' && ' (draft staging)' || '' }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to stage as a draft (for example, v0.7.0)'
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
    - name: Validate release tag
      id: meta
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
          echo 'Expected a release tag such as v0.7.0 or v0.7.0-rc.1' >&2
          exit 1
        fi
        if [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' ]]; then
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          if jq -se --arg tag "$RELEASE_TAG" 'any(.[][]; .tag_name == $tag and .draft == false)' "$RUNNER_TEMP/releases.json"; then
            echo 'Refusing to stage over a published release' >&2
            exit 1
          fi
        fi
        echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            arch: x86_64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    runs-on: ${{ matrix.runner }}

    steps:
    - uses: actions/checkout@v4

    - name: Install protobuf compiler
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: "1.91.0"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Cache cargo
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-${{ matrix.arch }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Test release
      run: cargo test --release --locked

    - name: Build release
      run: cargo build --release --locked

    - name: Build and push Docker image by digest
      id: build
      uses: docker/build-push-action@v6
      with:
        context: .
        platforms: ${{ matrix.platform }}
        push: true
        tags: dashpay/quorum-list-server
        outputs: type=image,push-by-digest=true,name-canonical=true
        labels: |
          org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          org.opencontainers.image.revision=${{ github.sha }}

    - name: Export digest
      run: |
        mkdir -p ${{ runner.temp }}/digests
        digest="${{ steps.build.outputs.digest }}"
        touch "${{ runner.temp }}/digests/${digest#sha256:}"

    - name: Upload digest
      uses: actions/upload-artifact@v4
      with:
        name: digests-${{ matrix.arch }}
        path: ${{ runner.temp }}/digests/*
        if-no-files-found: error
        retention-days: 1

    - name: Create release archive
      run: |
        cd target/release
        tar -czf quorum-list-server-linux-${{ matrix.arch }}.tar.gz quorum-list-server

    - name: Upload release archive
      uses: actions/upload-artifact@v4
      with:
        name: binary-${{ matrix.arch }}
        path: target/release/quorum-list-server-linux-${{ matrix.arch }}.tar.gz
        retention-days: 1

  merge-and-release:
    runs-on: ubuntu-latest
    needs: [prepare, build]

    steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Download digests
      uses: actions/download-artifact@v4
      with:
        pattern: digests-*
        path: ${{ runner.temp }}/digests
        merge-multiple: true

    - name: Create multi-platform manifest
      env:
        VERSION: ${{ needs.prepare.outputs.version }}
      run: |
        if [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' ]]; then
          tags=(-t "dashpay/quorum-list-server:${VERSION}-staging")
        else
          tags=(-t dashpay/quorum-list-server:latest -t "dashpay/quorum-list-server:${VERSION}")
        fi
        images=()
        for digest in "$RUNNER_TEMP"/digests/*; do
          images+=("dashpay/quorum-list-server@sha256:${digest##*/}")
        done
        docker buildx imagetools create "${tags[@]}" "${images[@]}"

    - name: Download binaries
      uses: actions/download-artifact@v4
      with:
        pattern: binary-*
        path: ${{ runner.temp }}/binaries
        merge-multiple: true

    - name: Checksum release archives
      run: |
        cd "$RUNNER_TEMP/binaries"
        sha256sum ./*.tar.gz > SHA256SUMS

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.RELEASE_TAG }}
        target_commitish: ${{ github.sha }}
        draft: ${{ github.event_name == 'workflow_dispatch' }}
        files: |
          ${{ runner.temp }}/binaries/*.tar.gz
          ${{ runner.temp }}/binaries/SHA256SUMS
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
