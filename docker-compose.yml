services:
  dashcore:
    image: dashpay/dashd:latest
    container_name: dashcore
    restart: unless-stopped
    profiles:
      - standalone
    volumes:
      - dashcore-data:/home/dash/.dashcore
      - ./dashcore-config/dash.${DASH_NETWORK}.conf:/home/dash/.dashcore/dash.conf:ro
    networks:
      - quorum-net
    healthcheck:
      test: ["CMD", "dash-cli", "-conf=/home/dash/.dashcore/dash.conf", "getblockchaininfo"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  quorum-list-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quorum-list-server
    restart: unless-stopped
    depends_on:
      dashcore:
        condition: service_healthy
        required: false
    ports:
      - "${API_PORT:-3000}:${API_PORT:-3000}"
    environment:
      - DASH_RPC_URL=http://${DASH_RPC_HOST:-host.docker.internal}:${DASH_RPC_PORT}
      - DASH_RPC_USER=${DASH_RPC_USER:-dashrpc}
      - DASH_RPC_PASSWORD=${DASH_RPC_PASSWORD}
      - DASH_NETWORK=${DASH_NETWORK}
      - API_HOST=0.0.0.0
      - API_PORT=${API_PORT:-3000}
      - QUORUM_PREVIOUS_BLOCKS_OFFSET=${QUORUM_PREVIOUS_BLOCKS_OFFSET:-8}
      - QUORUM_CACHE_TTL_SECONDS=${QUORUM_CACHE_TTL_SECONDS:-60}
    networks:
      - quorum-net

networks:
  quorum-net:
    driver: bridge

volumes:
  dashcore-data:
